services:
  mongo:
    image: mongo:7
    container_name: cyberkids-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cyberkids
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cyberkids-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: cyberkids
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: cyberkids-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
